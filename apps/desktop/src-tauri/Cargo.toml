[package]
name = "syncwatch-desktop"
description = "SyncWatch desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "syncwatch"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
tauri.workspace = true
tauri-plugin-dialog.workspace = true
syncwatch-player.workspace = true
syncwatch-protocol.workspace = true
syncwatch-ice-config = { path = "../../../crates/ice-config" }
blake3.workspace = true
syncwatch-net = { path = "../../../crates/net" }
syncwatch-sync-core = { workspace = true }
chardetng = { version = "=1.0.0", default-features = false }
encoding_rs = "=0.8.42"
tokio = { version = "1.53.3", features = ["sync", "time"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
directories.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
] }

[lints]
workspace = true
