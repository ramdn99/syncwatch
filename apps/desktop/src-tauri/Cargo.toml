[package]
name = "syncwatch-desktop"
description = "SyncWatch desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "syncwatch"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
tauri.workspace = true
tauri-plugin-dialog.workspace = true
syncwatch-player.workspace = true
syncwatch-protocol.workspace = true
syncwatch-ice-config = { path = "../../../crates/ice-config" }
blake3.workspace = true
syncwatch-net = { path = "../../../crates/net" }
syncwatch-torrent = { path = "../../../crates/torrent" }
syncwatch-sync-core = { workspace = true }
chardetng = { version = "=1.0.0", default-features = false }
encoding_rs = "=0.8.42"
tokio = { version = "1.53.3", features = ["sync", "time"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
directories.workspace = true

# In-app updates (ADR 0016): rustls HTTP (same features as ice-config), minisign signatures.
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider"] }
minisign-verify = "=0.3.0"
semver = "1.0.28"
sha2 = "0.10.9"
base64 = { version = "=0.22.1", default-features = false, features = ["alloc"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_Storage_FileSystem",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
] }

[lints]
workspace = true

[dev-dependencies]
tokio = { version = "1.53.3", features = ["rt", "macros", "net", "time"] }
