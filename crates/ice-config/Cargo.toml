[package]
name = "syncwatch-ice-config"
description = "Metered credentials: allowlisted fetch, lenient ICE parsing, validation, STUN/TURN connection test, secure storage"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# rustls-only, ring provider (no aws-lc C build, no native-tls/openssl). See ADR 0004.
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-platform-verifier = "0.7.1"
json5 = "=1.3.3"
keyring = "=4.2.0"
tokio = { version = "1.53.3", features = ["net", "time", "io-util", "rt", "rt-multi-thread", "macros", "sync"] }
hmac = "0.13.0"
sha1 = "0.11.0"
md-5 = "0.11.0"
crc32fast = "1.5.3"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory"] }

[dev-dependencies]
tokio = { version = "1.53.3", features = ["net", "time", "io-util", "rt", "rt-multi-thread", "macros"] }

[lints]
workspace = true
