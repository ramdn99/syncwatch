# cargo-deny configuration (spec section 12; ADRs 0004 and 0009).
# Run: cargo deny check bans advisories sources

[graph]
# The product ships for Windows only. Linux-only dependencies (crypto-hash -> OpenSSL) appear
# in Cargo.lock but are never built; see docs/build-guide.md.
targets = ["x86_64-pc-windows-msvc"]
all-features = false

[bans]
multiple-versions = "allow"
wildcards = "allow"
# TLS: rustls + ring only.
deny = [
  { crate = "aws-lc-rs", reason = "rustls must use ring (ADR 0004/0009)" },
  { crate = "aws-lc-sys", reason = "rustls must use ring (ADR 0004/0009)" },
  { crate = "native-tls", reason = "rustls only (ADR 0004)" },
  { crate = "openssl", reason = "rustls only (ADR 0004)" },
  { crate = "openssl-sys", reason = "rustls only (ADR 0004)" },
]

[advisories]
# Unmaintained crates deep in third-party trees are reported, not fatal; vulnerabilities fail.
unmaintained = "workspace"
yanked = "deny"
ignore = [
  # ringbuf 0.4.8 via librqbit-utp 0.7.0 (the newest uTP crate; the fix is ringbuf 0.5.2, a
  # semver-incompatible bump only librqbit-utp can make). Not reachable for us: (1) librqbit-utp
  # stores only u8 in it (SharedRb<Heap<u8>>), and the bug needs an element Drop that panics;
  # (2) our sessions listen TcpOnly, so no uTP socket exists and uTP never runs. Re-check on
  # every librqbit upgrade (docs/build-guide.md, "Upgrading librqbit"). Re-checked 2026-11-14:
  # ringbuf is fixed in >= 0.5.2 (latest 0.6.0), but librqbit-utp is still 0.7.0 (ringbuf
  # "0.4.7"), and librqbit 9.1.0 still depends on librqbit-utp 0.7: upgrading would not help.
  { id = "RUSTSEC-2026-0293", reason = "u8-only ring buffer in librqbit-utp; uTP disabled (TcpOnly)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
