# Development stack: signaling server + a local coturn for relay-only tests (no Metered quota).
#   docker compose -f deploy/compose.dev.yml up -d --build
#   docker compose -f deploy/compose.dev.yml down
# The coturn user below is a LOCAL DEV value for this container only, not a real credential.

name: syncwatch-dev

services:
  signaling:
    build:
      context: ..
      dockerfile: deploy/signaling/Dockerfile
    ports:
      - "127.0.0.1:8787:8787"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  coturn:
    image: coturn/coturn:4.18.0-r0-alpine@sha256:c29135c08565810d37053f384584392b7c24b69570fc81a721b878d6fe63e04e
    command:
      - --listening-port=3478
      - --fingerprint
      - --lt-cred-mech
      - --user=syncwatch-dev:syncwatch-dev-pass
      - --realm=syncwatch.local
      - --min-port=49160
      - --max-port=49200
      - --no-tls
      - --no-multicast-peers
      - --log-file=stdout
    ports:
      - "127.0.0.1:3478:3478/udp"
      - "127.0.0.1:3478:3478/tcp"
    security_opt: ["no-new-privileges:true"]
