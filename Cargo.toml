[workspace]
resolver = "3"
members = ["crates/player", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.99"
repository = "https://github.com/ramdn99/syncwatch"
publish = false

[workspace.dependencies]
libmpv2 = "=6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "std", "ansi"] }
directories = "6.0.0"
tauri = { version = "=2.12.4", features = [] }
tauri-build = { version = "=2.7.3", features = [] }
tauri-plugin-dialog = "=2.8.3"
windows = "0.62.2"
syncwatch-player = { path = "crates/player" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
dbg_macro = "deny"
print_stdout = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
